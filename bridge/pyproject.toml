[project]
name = "hermes-bridge"
version = "0.1.0"
description = "Hermes Mobile Gateway — FastAPI Bridge relaying app <-> Hermes Agent."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "python-multipart>=0.0.12",
    "qrcode[pil]>=7.4",
]

[project.optional-dependencies]
dev = ["jsonschema>=4.23"]

[project.scripts]
bridge = "bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
